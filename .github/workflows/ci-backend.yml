name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-backend:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: order-service
            working-directory: backend/order-service
            command: ./mvnw test
          - service: payment-service
            working-directory: backend/payment-service
            command: ./mvnw test
          - service: catalog-service
            working-directory: backend/catalog-service
            command: ./mvnw test
          - service: user-service
            working-directory: backend/user-service
            command: ./mvnw test
          - service: api-gateway
            working-directory: backend/api-gateway
            command: ./mvnw test
          - service: delivery-service
            working-directory: backend/delivery-service
            command: mvn test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ensure Maven wrappers are executable
        run: chmod +x backend/order-service/mvnw backend/payment-service/mvnw backend/catalog-service/mvnw backend/user-service/mvnw backend/api-gateway/mvnw

      - name: Run tests
        run: ${{ matrix.command }}
        working-directory: ${{ matrix.working-directory }}

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
