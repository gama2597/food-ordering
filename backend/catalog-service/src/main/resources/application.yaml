server:
  port: 8082

spring:
  application:
    name: catalog-service
  datasource:
    # Aplicando 12-Factor App: Variables de entorno con valores por defecto locales
    url: ${DB_URL:jdbc:postgresql://localhost:5433/catalog_db}
    username: ${DB_USER:food_app_user}
    password: ${DB_PASSWORD:food_app_password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URI:http://localhost:8080/realms/food-ordering}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        # ¡Añadimos prometheus aquí!
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
