spring:
  datasource:
    url: jdbc:h2:mem:order_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/mock-jwks
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

clients:
  catalog-service:
    url: http://localhost:8082

app:
  kafka:
    topics:
      order-created: order.created
      payment-requested: payment.requested
      payment-approved: payment.approved
      payment-rejected: payment.rejected
